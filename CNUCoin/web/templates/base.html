<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CNUCoin{% endblock %} · CNUCoin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="logo"><span class="coin">₵</span> CNUCoin</div>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Огляд</a>
    <a href="{{ url_for('members_page') }}" class="{{ 'active' if request.endpoint in ('members_page', 'wallet') }}">Учасники</a>
    <a href="{{ url_for('explorer') }}" class="{{ 'active' if request.endpoint == 'explorer' }}">Оглядач блоків</a>
  </nav>
  <span class="tag">SHA-256 · ECDSA secp256k1 · Proof-of-Work</span>
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
